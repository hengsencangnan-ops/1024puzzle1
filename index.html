<!DOCTYPE html>
<html>
<head>
	<title>18課題04 by1T1 19</title>
	<meta charset="utf-8">
	<style>
		/* 全体背景とフォントの設定 */
		body {
			background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
			color: #e0e6ed;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			margin: 0;
		}

		h2 {
			margin: 10px 0;
			text-transform: uppercase;
			letter-spacing: 2px;
			text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
		}

		/* ボードの外枠と光彩効果 */
		#board {
			border-collapse: separate;
			border-spacing: 3px;
			background: #111425;
			padding: 8px;
			border-radius: 10px;
			box-shadow: 0 0 20px rgba(0, 243, 255, 0.2), inset 0 0 15px rgba(0, 0, 0, 0.8);
			border: 2px solid #00f3ff;
		}

		/* 各マス目のデザイン */
		td {
			width: 32px;
			height: 32px;
			font-size: 11pt;
			font-weight: bold;
			text-align: center;
			border-radius: 4px;
			cursor: pointer;
			user-select: none;
			transition: all 0.15s ease-in-out;
			box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 2px 4px rgba(0, 0, 0, 0.5);
		}

		/* パネルの状態別カラー（ネオン・ゲーム風） */
		/* 通常（間違った位置）：スタイリッシュなダークブルー */
		td.br {
			background: linear-gradient(135deg, #2a3459 0%, #171e38 100%);
			color: #8da4c4;
			border: 1px solid #3d4f7c;
		}

		/* 正解位置：ネオンブルーに発光 */
		td.bb {
			background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%);
			color: #ffffff;
			border: 1px solid #00f3ff;
			box-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
		}

		/* 空白マス */
		td.bg {
			background: #0d111a;
			border: 1px dashed #21293d;
			box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.9);
		}

		/* ホバー時の演出 */
		td.br:hover, td.bb:hover {
			transform: scale(1.08);
			filter: brightness(1.2);
			z-index: 10;
		}

		/* ボタンデザイン */
		button#reset {
			background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%);
			color: #fff;
			border: none;
			padding: 10px 24px;
			font-size: 14pt;
			font-weight: bold;
			border-radius: 20px;
			cursor: pointer;
			box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
			transition: all 0.2s ease;
			margin-bottom: 15px;
		}

		button#reset:hover {
			transform: translateY(-2px);
			box-shadow: 0 0 25px rgba(255, 0, 127, 0.8);
		}

		/* テキストメッセージ */
		#complete {
			color: #00f3ff;
			font-size: 18pt;
			height: 30px;
		}
	</style>
	<script>
		const SIZE = 32; 
		const TOTAL = SIZE * SIZE; 

		// 初期表作成
		window.onload = function() {
			let board = document.getElementById('board');
			for (let i = 0; i < SIZE; i++) {
				let tr = document.createElement('tr');
				for (let j = 0; j < SIZE; j++) {
					let td = document.createElement('td');
					tr.appendChild(td);
				}
				board.appendChild(tr);
			}
			reset();
		}

		// 完全均等シャッフル ＋ 可解性（詰み回避）チェック付き初期設定
		function init() {
			let cells = document.getElementsByTagName('td');
			let numbers = [];
			
			// 1〜399の数値と空きマス('')の配列を準備
			for (let i = 1; i < TOTAL; i++) {
				numbers.push(i);
			}
			numbers.push('');

			// フィッシャー–イエーツ（Fisher-Yates）アルゴリズムで均等シャッフル
			let isSolvable = false;
			while (!isSolvable) {
				for (let i = numbers.length - 1; i > 0; i--) {
					let r = Math.floor(Math.random() * (i + 1));
					[numbers[i], numbers[r]] = [numbers[r], numbers[i]];
				}
				// 15パズルの可解性定理判定（解ける配置かどうか）
				isSolvable = checkSolvable(numbers);
			}

			// 盤面に均等シャッフル結果を反映
			for (let i = 0; i < cells.length; i++) {
				cells[i].innerHTML = numbers[i];
				cells[i].setAttribute('onclick', 'clicked(' + i + ')');
			}
			check();
		}

		// N×Nスライドパズルの解法可能性チェック関数
		function checkSolvable(arr) {
			let inversions = 0;
			let emptyRowFromBottom = 0;

			for (let i = 0; i < arr.length; i++) {
				if (arr[i] === '') {
					emptyRowFromBottom = SIZE - Math.floor(i / SIZE);
					continue;
				}
				for (let j = i + 1; j < arr.length; j++) {
					if (arr[j] !== '' && arr[i] > arr[j]) {
						inversions++;
					}
				}
			}
			// グリッド幅が偶数(20)の場合の判定ロジック
			return (emptyRowFromBottom % 2 === 0) ? (inversions % 2 !== 0) : (inversions % 2 === 0);
		}

		// クリック処理（20x20対応）
		function clicked(e) {
			let cells = document.getElementsByTagName('td');
			if (e - SIZE >= 0 && cells[e - SIZE].innerHTML === '') {
				swap(e, e - SIZE);
			} else if (e + SIZE < TOTAL && cells[e + SIZE].innerHTML === '') {
				swap(e, e + SIZE);
			} else if (e % SIZE !== 0 && cells[e - 1].innerHTML === '') {
				swap(e, e - 1);
			} else if (e % SIZE !== SIZE - 1 && cells[e + 1].innerHTML === '') {
				swap(e, e + 1);
			}
		}

		// 置き換え処理
		function swap(a, b) {
			let cells = document.getElementsByTagName('td');
			[cells[a].innerHTML, cells[b].innerHTML] = [cells[b].innerHTML, cells[a].innerHTML];
			check();
		}

		// 完成チェック処理
		function check() {
			let cells = document.getElementsByTagName('td');
			let countok = 0;
			let targetCount = TOTAL - 1; 

			for (let i = 0; i < cells.length; i++) {
				if (parseInt(cells[i].innerHTML) === i + 1) {
					cells[i].className = 'bb';
					countok++;
				} else if (cells[i].innerHTML === '') {
					cells[i].className = 'bg';
				} else {
					cells[i].className = 'br';
				}
			}
			
			if (countok === targetCount) {
				document.getElementById('complete').innerHTML = 'COMPLETE!';
				document.getElementById('reset').innerHTML = 'PLAY AGAIN';
			} else {
				document.getElementById('complete').innerHTML = 'REMAINING: ' + (targetCount - countok);
			}
		}

		// リセット処理
		function reset() {
			init();
			document.getElementById('reset').innerHTML = 'RESET';
		}
	</script>
</head>
<body>
	<h2>SLIDE PUZZLE</h2>
	<button id="reset" onclick="reset()">RESET</button>
	<table id="board"></table>
	<h2 id="complete"></h2>
</body>
</html>
